name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Verify vendored MP Frontend packages
        run: node scripts/verify-core-artifacts.mjs
      - name: Verify public documentation boundary
        run: node scripts/verify-public-repository.mjs
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Uncached source verification
        run: pnpm check --skip-nx-cache
