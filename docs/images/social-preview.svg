<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <title id="title">Tiffin Frontend ecosystem</title>
  <desc id="desc">A real food-delivery reference built on MP Frontend. Three connected groups show people, product surfaces, tiffin platform.</desc>
  <defs>
